name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, python: "3.10", runner: ubuntu-latest}
          - {os: macos, python: "3.10", runner: macos-latest}
          - {os: windows, python: "3.10", runner: windows-latest}
          # The scripts claim 3.8 compatibility; Ubuntu 22.04 still has a 3.8 build for setup-python.
          - {os: linux, python: "3.8", runner: ubuntu-22.04}
          - {os: linux, python: "3.14", runner: ubuntu-22.04}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r ci/requirements-test.txt
      - run: python -m pytest tests -q
