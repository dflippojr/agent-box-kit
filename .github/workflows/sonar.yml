name: SonarCloud

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    # Dependabot PRs use the Dependabot SONAR_TOKEN secret. Forks receive no token.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check token availability
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN secret is not set; skipping SonarCloud analysis. Configure both Actions and Dependabot secrets."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.available == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.token.outputs.available == 'true'
        with:
          python-version: '3.12'
      - name: Test with subprocess coverage
        if: steps.token.outputs.available == 'true'
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: |
          python -m pip install -r ci/requirements-sonar.txt
          python -m coverage run -m pytest tests -q
          python -m coverage combine
          python -m coverage xml
      - name: Scan and check quality gate
        if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
